services:
  # Base de datos INTERNA de Temporal (guarda el historial de workflows).
  # Es totalmente independiente de tu Postgres de Neon.
  postgresql:
    image: postgres:15
    container_name: temporal-postgresql
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    ports:
      - "5433:5432" # 5433 en tu máquina para no chocar con un Postgres local si tenés uno
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data

  # El Temporal Server: acá se registran y ejecutan los workflows.
  # Se conecta a la base "postgresql" de arriba, no a Neon.
  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: temporal-server
    depends_on:
      - postgresql
    environment:
      - DB=postgres12
      - DB_PORT=5432
      - POSTGRES_USER=temporal
      - POSTGRES_PWD=temporal
      - POSTGRES_SEEDS=postgresql
    ports:
      - "7233:7233" # Puerto gRPC: por acá se conectan tu Worker y tu Client (FastAPI)

  # Interfaz web para ver workflows, su estado y su historial paso a paso.
  temporal-ui:
    image: temporalio/ui:2.31.2
    container_name: temporal-ui
    depends_on:
      - temporal
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - TEMPORAL_CORS_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080" # Acá entrás desde el navegador: http://localhost:8080

volumes:
  temporal-postgres-data:
